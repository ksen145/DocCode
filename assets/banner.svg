<?xml version="1.0" encoding="UTF-8"?>
<!--
  Баннер для README (EN/RU). Логотип повторяет geometry packaging/icon/icon.svg.
  Без внешних ресурсов: GitHub рендерит SVG как обычную картинку.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="DocCode — interactive HTML documentation from source code, fully local">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10214A"/>
      <stop offset="1" stop-color="#11286B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#11286B"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F0FF"/>
    </linearGradient>
    <filter id="sheetShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#060F2D" flood-opacity="0.55"/>
    </filter>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" rx="24" ry="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" ry="24" fill="url(#glow)"/>

  <!-- логотип -->
  <g transform="translate(72,58) scale(0.18)">
    <g clip-path="url(#rounded)">
      <rect width="1024" height="1024" fill="url(#logoBg)"/>
      <rect width="1024" height="460" fill="url(#gloss)"/>
    </g>
    <rect x="282" y="190" width="460" height="644" rx="48" ry="48" fill="url(#paper)" filter="url(#sheetShadow)"/>
    <g fill="none" stroke="#1D4ED8" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 432.8 292.8 L 360.8 372 L 432.8 451.2"/>
      <path d="M 477.8 463.1 L 546.2 280.9"/>
      <path d="M 591.2 292.8 L 663.2 372 L 591.2 451.2"/>
    </g>
    <g fill="#8FA3C2">
      <rect x="342" y="528" width="340" height="34" rx="17" ry="17"/>
      <rect x="342" y="602" width="360" height="34" rx="17" ry="17"/>
      <rect x="342" y="676" width="318" height="34" rx="17" ry="17"/>
      <rect x="342" y="750" width="278" height="34" rx="17" ry="17"/>
    </g>
  </g>

  <!-- название и подзаголовок -->
  <text x="300" y="142" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="88" font-weight="700" fill="#F8FAFC" letter-spacing="-1">DocCode</text>
  <text x="304" y="192" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="28" fill="#9DB4E0">Interactive HTML documentation from source code</text>

  <!-- пилюли со стеком -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#C7D7F5">
    <rect x="304" y="222" width="112" height="38" rx="19" fill="#1E3A8A" fill-opacity="0.55" stroke="#3B82F6" stroke-opacity="0.45"/>
    <text x="332" y="247">Rust</text>

    <rect x="428" y="222" width="132" height="38" rx="19" fill="#1E3A8A" fill-opacity="0.55" stroke="#3B82F6" stroke-opacity="0.45"/>
    <text x="452" y="247">Ollama</text>

    <rect x="572" y="222" width="160" height="38" rx="19" fill="#1E3A8A" fill-opacity="0.55" stroke="#3B82F6" stroke-opacity="0.45"/>
    <text x="592" y="247">tree-sitter</text>

    <rect x="744" y="222" width="176" height="38" rx="19" fill="#1E3A8A" fill-opacity="0.55" stroke="#3B82F6" stroke-opacity="0.45"/>
    <text x="764" y="247">Qdrant Edge</text>
  </g>
</svg>
