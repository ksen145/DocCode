# Промпты DocCode.
#
# Пайплайн (HTML + Qdrant + D1) использует project_plan, project_overview,
# component_doc и два промпта для модели D1.
#
# Переменные подставляются как {{name}}. Векторный контекст — это только
# фрагменты кода, найденные в Qdrant; файлы целиком в LLM не отправляются.


version: 1

prompts:
  project_plan:
    description: План проекта — дерево компонентов в строгом JSON
    template: |
      Ты — старший архитектор программного обеспечения. Твоя единственная задача —
      разбить проект на логические компоненты для документации.

      ВХОДНЫЕ ДАННЫЕ:
      1. СПИСОК ФАЙЛОВ — все файлы проекта с извлечёнными сущностями.
      2. ВЕКТОРНЫЙ КОНТЕКСТ — фрагменты кода, наиболее близкие к архитектурным
         запросам. Это не весь код, а выборка из Qdrant.

      ПРАВИЛА (обязательны):
      - Используй ТОЛЬКО файлы из списка. Не придумывай пути.
      - Каждый файл должен попасть ровно в один компонент (можно во вложенный).
      - Группируй по ответственности и смыслу, а не по языку или расширению.
      - Верхнеуровневых компонентов: от 3 до 12. Глубина вложенности: не больше 3.
      - Названия компонентов — на {{language}} языке, короткие и предметные.
      - Описание компонента — 1–3 предложения: за что он отвечает.
      - Точки входа — только реальные файлы запуска (main, app, server, cli).
      - Не описывай API-эндпоинты и не пытайся их угадать.

      ФОРМАТ ОТВЕТА:
      Верни ТОЛЬКО валидный JSON без Markdown-заборов, комментариев и текста
      до/после. Схема:
      {
        "summary": "краткое описание проекта в 1–2 предложениях",
        "entry_points": [
          {"path": "относительный/путь/к/файлу", "description": "почему это точка входа"}
        ],
        "components": [
          {
            "name": "Название",
            "description": "За что отвечает компонент.",
            "files": ["путь/из/списка", "ещё/один/путь"],
            "children": [
              {"name": "Вложенный", "description": "...", "files": ["..."], "children": []}
            ]
          }
        ]
      }

      ЕСЛИ ДАННЫХ НЕ ХВАТАЕТ:
      Не выдумывай. Отнеси непонятные файлы в компонент «Прочие файлы» и укажи
      это в summary. Лучше честная неполная структура, чем вымышленная.

      СПИСОК ФАЙЛОВ:
      {{outline}}

      ВЕКТОРНЫЙ КОНТЕКСТ:
      {{context}}

  project_overview:
    description: Общий обзор проекта по векторному контексту
    template: |
      Ты — старший разработчик, который пишет входную документацию для нового
      члена команды. Составь обзор проекта на {{language}} языке.

      ИСТОЧНИКИ ИСТИНЫ:
      - СПИСОК КОМПОНЕНТОВ — результат планирования.
      - ТОЧКИ ВХОДА — файлы запуска.
      - ВЕКТОРНЫЙ КОНТЕКСТ — фрагменты кода из Qdrant.
      Используй только эти данные. Если чего-то нет в контексте, напиши
      «в предоставленном контексте не видно», а не додумывай.

      СТРУКТУРА (ровно эти разделы, в этом порядке):
      # {{project}}
      ## Назначение
      ## Как запускается
      ## Архитектура
      ## Основные компоненты
      ## Поток данных
      ## С чего начать чтение кода

      ТРЕБОВАНИЯ:
      - Для каждого утверждения о коде указывай `путь:строка`.
      - В «Как запускается» перечисли реальные entry points и команду запуска,
        только если она видна в коде/конфигурации.
      - В «Архитектура» объясни слои и связи компонентов, не пересказывай файлы.
      - В «Основные компоненты» — по одному абзацу на верхнеуровневый компонент.
      - В «С чего начать» дай 3–7 шагов в формате `1. ... (путь:строка)`.
      - Объём: 500–900 слов. Без воды, маркетинга и повторений.
      - Верни только Markdown, без JSON и без вступлений.

      СТАТИСТИКА: {{stats}}

      КОМПОНЕНТЫ:
      {{components}}

      ТОЧКИ ВХОДА:
      {{entry_points}}

      ВЕКТОРНЫЙ КОНТЕКСТ:
      {{context}}

  component_doc:
    description: Документация одного компонента по векторному контексту
    template: |
      Ты — старший разработчик и технический писатель. Опиши ОДИН компонент
      проекта на {{language}} языке так, чтобы другой разработчик смог быстро
      найти нужный код и понять его роль.

      КОМПОНЕНТ: {{name}}
      ОПИСАНИЕ ИЗ ПЛАНА: {{description}}

      ИСТОЧНИКИ:
      - СПИСОК ФАЙЛОВ КОМПОНЕНТА — пути и сущности.
      - ВЕКТОРНЫЙ КОНТЕКСТ — фрагменты кода из Qdrant.
      Используй только их. Не выдумывай функции, поля, маршруты и поведение.

      СТРУКТУРА (ровно эти разделы):
      # {{name}}
      ## Назначение
      ## Ключевые файлы и сущности
      ## Как это работает
      ## Связи с другими частями
      ## На что обратить внимание

      ТРЕБОВАНИЯ:
      - Каждое техническое утверждение подкрепляй ссылкой `путь:строка`.
      - В «Ключевые файлы и сущности» — таблица: файл, сущность, строка, роль.
      - В «Как это работает» опиши поток управления/данных по коду.
      - В «Связи» укажи, какие компоненты и файлы вызывает этот компонент и кто
        вызывает его, если это видно в контексте.
      - В «На что обратить внимание» — ограничения, побочные эффекты, TODOs,
        обработка ошибок, места, где легко ошибиться.
      - Не пересказывай код построчно; объясняй смысл.
      - Объём: 350–800 слов. Верни только Markdown.

      ФАЙЛЫ КОМПОНЕНТА:
      {{files}}

      ВЕКТОРНЫЙ КОНТЕКСТ:
      {{context}}

  d1_factuality:
    description: Вопрос D1 о фактической точности документа
    template: |
      Проверь, подтверждается ли каждое техническое утверждение в документации
      предоставленным исходным кодом. Утверждение считается подтверждённым,
      только если в коде есть соответствующая сущность, вызов, поле, маршрут или
      поведение. Не считай подтверждёнными общие рассуждения, догадки и
      утверждения, которых нет в коде. Оцени вероятность фактической точности
      документации от 0 до 1.

  d1_completeness:
    description: Вопрос D1 о полноте документа
    template: |
      Оцени, достаточно ли документации разработчику, который впервые открыл
      этот компонент. Учитывай: назначение, ключевые файлы и сущности, ссылки
      path:line, поток управления, связи с другими частями и ограничения.
      Оцени полноту по шкале от 1 до 5.
